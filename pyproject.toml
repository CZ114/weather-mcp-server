[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-mcp-server"
version = "1.0.0"
description = "Real-time weather query MCP server based on HelloAgents framework"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "ZheC", email = "ssyzc1011@gmail.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0,<3.0.0",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/CZ114/weather-mcp-server"
Repository = "https://github.com/CZ114/weather-mcp-server"
"Bug Tracker" = "https://github.com/CZ114/weather-mcp-server/issues"

[tool.setuptools]
py-modules = ["server"]
